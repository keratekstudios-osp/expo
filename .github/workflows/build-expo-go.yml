name: Build Expo Go

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (android, ios, or all)'
        required: false
        default: 'all'
  push:
    branches: [main, 'sdk-*']
    paths:
      - .github/workflows/build-expo-go.yml
      - apps/eas-expo-go/**
      - apps/expo-go/android/**
      - apps/expo-go/ios/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (publish-client)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' }}
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4

      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔧 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🏗 Build Android with EAS
        run: eas build --platform android --profile publish-client --non-interactive
        working-directory: apps/eas-expo-go
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔔 Notify on Slack
        uses: ./.github/actions/slack-notify
        if: failure() && (github.event.ref == 'refs/heads/main' || startsWith(github.event.ref, 'refs/heads/sdk-'))
        with:
          webhook: ${{ secrets.slack_webhook_api }}
          author_name: Build Expo Go (Android)

  build-ios:
    name: Build iOS (publish-client)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' }}
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4

      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔧 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🏗 Build iOS with EAS
        run: eas build --platform ios --profile publish-client --non-interactive
        working-directory: apps/eas-expo-go
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔔 Notify on Slack
        uses: ./.github/actions/slack-notify
        if: failure() && (github.event.ref == 'refs/heads/main' || startsWith(github.event.ref, 'refs/heads/sdk-'))
        with:
          webhook: ${{ secrets.slack_webhook_api }}
          author_name: Build Expo Go (iOS)
